services:
  etsy-codex-renderer:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH, FOWNER, SETGID, SETPCAP, SETUID]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /run:rw,nosuid,nodev,size=32m
      - /tmp:rw,nosuid,nodev,size=512m
    environment:
      - SERVICE_URL_ETSY_CODEX_RENDERER_8080=/
      - ETSY_CODEX_RENDERER_TOKEN
      - CODEX_HOME=/tmp/etsy-codex-home
      # Mount the persistent server Codex home as a directory. Codex refreshes
      # auth.json with atomic replacement; a single-file bind would keep the
      # renderer pinned to the old inode (or cause Docker to create a
      # directory when the source is temporarily absent).
      - CODEX_AUTH_SOURCE=/run/secrets/codex-session/auth.json
      - RENDER_DATA_DIR=/data
      - CODEX_RENDER_TIMEOUT_SECONDS
      - OPENAI_API_KEY
      - OPENAI_API_BASE_URL
      - OPENAI_PROJECT
      - OPENAI_ORGANIZATION
      - OPENAI_IMAGE_FALLBACK_MODEL
      - OPENAI_IMAGE_FALLBACK_IMAGE_MODEL
      - OPENAI_IMAGE_FALLBACK_QUALITY
      - OPENAI_IMAGE_FALLBACK_SIZE
      - OPENAI_IMAGE_FALLBACK_TIMEOUT_SECONDS
      - CODEX_QUOTA_CIRCUIT_SECONDS
    volumes:
      - renderer-data:/data
      - /root/.codex:/run/secrets/codex-session:ro
    expose:
      - "8080"
    networks:
      - windmill

volumes:
  renderer-data:

networks:
  windmill:
    external: true
    name: m9qaud6gadgni5bxty30bkdl
