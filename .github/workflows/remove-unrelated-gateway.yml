name: Remove unrelated gateway
# One-shot cleanup trigger

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-unrelated-gateway.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore renderer-only repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout c20ea1b5cbd92f9fddd7b49cbeaf708310ef06f2 -- app.py Dockerfile requirements.txt
          git rm -f gateway.py tests/test_gateway.py
          git commit -m "Remove unrelated Luna gateway from Etsy renderer"
          git push origin HEAD:main
