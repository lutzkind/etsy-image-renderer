name: CI
on:
  pull_request:

concurrency:
  group: etsy-image-renderer-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, ci, isolated]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enforce renderer-only repository boundary
        shell: bash
        run: |
          set -euo pipefail
          test ! -e gateway.py
          test ! -e tests/test_gateway.py
          ! grep -R --line-number -E 'app\.mount\("/luna"|Windmill Luna Gateway|openai-api-server-via-codex' app.py Dockerfile requirements.txt tests
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - run: docker build --build-arg CODEX_VERSION=0.145.0 -t etsy-codex-renderer:test .
