name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Test renderer
        run: pytest -q tests/test_app.py
      - name: Test Luna gateway
        run: pytest -q tests/test_gateway.py
      - run: docker build --build-arg CODEX_VERSION=0.145.0 -t etsy-codex-renderer:test .
